<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelGo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-plane-departure"></i> TravelGo
        </a>
        <ul class="nav-links" id="nav-links"></ul>
    </nav>

    <main class="container">
        <div class="form-card">
            <div class="page-header" style="margin-bottom: 1.5rem;">
                <h1>Welcome Back</h1>
                <p>Log in to access your bookings and travel preferences.</p>
            </div>

            <div id="alert-banner" class="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@travelgo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Log In</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 600;">Register Here</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-bottom">&copy; 2026 TravelGo Portal.</div>
    </footer>

    <script src="api.js"></script>
    <script>
        const alertBanner = document.getElementById('alert-banner');
        function showAlert(msg, type = 'danger') {
            alertBanner.className = `alert alert-${type}`;
            alertBanner.innerHTML = msg;
            alertBanner.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === '1') {
                showAlert('Account created successfully! Please log in with your credentials.', 'success');
            } else if (urlParams.get('session_expired') === '1') {
                showAlert('Your session has expired. Please log in again.');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBanner.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const res = await api.post('/auth/login', { email, password });

            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';

            if (res.ok && res.data.success) {
                setAuth(res.data.token, res.data.user);
                showAlert('Login successful! Redirecting...', 'success');

                const urlParams = new URLSearchParams(window.location.search);
                const redirectTarget = urlParams.get('redirect');

                setTimeout(() => {
                    if (res.data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (redirectTarget) {
                        window.location.href = redirectTarget;
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 800);
            } else {
                showAlert(escapeHTML(res.data.message || 'Invalid email or password.'));
            }
        });
    </script>
</body>
</html>
